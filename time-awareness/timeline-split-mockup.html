<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计划/记录 一致布局 — 原型</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background:#f0f2f5; padding:12px; color:#333; }
  .container { max-width:460px; margin:0 auto; }

  .mode-toggle { display:flex; gap:0; margin-bottom:10px; background:#e5e7eb; border-radius:10px; padding:3px; }
  .mode-toggle button { flex:1; padding:8px; border:none; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; background:transparent; color:#9ca3af; transition:.15s; }
  .mode-toggle button.active { background:#fff; color:#333; box-shadow:0 1px 3px rgba(0,0,0,.1); }

  .top-block { background:#fff; border-radius:12px; padding:14px 16px; margin-bottom:10px; display:flex; flex-direction:column; gap:8px; box-shadow:0 1px 3px rgba(0,0,0,.03); }
  .top-block .icon { font-size:22px; }
  .top-block .text { font-size:14px; font-weight:600; }
  .top-block .sub  { font-size:11px; color:#9ca3af; }
  .top-block .time-display { margin-left:auto; font-size:28px; font-weight:700; color:#4A90D9; font-variant-numeric:tabular-nums; }
  .top-block .timer-label { margin-left:auto; text-align:right; }
  .top-block .timer-label .timer-cat { font-size:12px; color:#9ca3af; }
  .top-block .timer-label .timer-val { font-size:28px; font-weight:700; color:#4A90D9; font-variant-numeric:tabular-nums; }
  .top-block .status-row { display:flex; align-items:center; gap:6px; }
  .top-block .plan-info { display:flex; align-items:center; gap:8px; padding:8px 0; }
  .top-block .plan-info .plan-emoji { font-size:20px; }
  .top-block .plan-info .plan-detail { font-size:13px; font-weight:600; }
  .top-block .plan-info .plan-time { font-size:12px; color:#9ca3af; }
  .top-block .plan-tip { font-size:10px; color:#b0b0b0; padding:2px 0; }
  .top-block .progress-bar { height:4px; background:#e5e7eb; border-radius:2px; overflow:hidden; }
  .top-block .progress-bar .fill { height:100%; background:#4A90D9; border-radius:2px; transition:width .5s; }
  .top-block .end-btn { margin-top:2px; padding:8px; border-radius:8px; border:1px solid #e8c0c0; background:#fff5f5; color:#c04040; font-size:12px; text-align:center; cursor:pointer; width:100%; }
  .top-block .record-status { display:flex; align-items:center; gap:6px; font-size:12px; color:#9ca3af; }
  .top-block .record-timer { font-size:36px; font-weight:700; color:#4A90D9; text-align:center; font-variant-numeric:tabular-nums; }
  .top-block .record-cat { display:flex; align-items:center; justify-content:center; gap:6px; font-size:14px; font-weight:600; }
  .pause-indicator { display:inline-block; width:6px; height:6px; border-radius:50%; background:#4A90D9; margin-right:4px; animation:blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:0} 50%{opacity:1} }

  .cat-row { display:flex; gap:6px; margin-bottom:10px; }
  .cat-btn { flex:1; padding:10px 3px; border-radius:10px; border:1.5px solid #e5e7eb; background:#fff; font-size:10px; cursor:pointer; text-align:center; display:flex; flex-direction:column; align-items:center; gap:3px; color:#6b7280; transition:.15s; }
  .cat-btn .emoji { font-size:17px; }
  .cat-btn:hover { border-color:#b0b8c0; }
  .cat-btn:active { transform:scale(.96); }
  .cat-btn.work   { border-color:#c8d4ec; color:#6a80a8; background:#f5f8ff; }
  .cat-btn.work.active   { border-color:#3366cc; color:#3366cc; background:#dce8ff; }
  .cat-btn.house  { border-color:#d4c8e8; color:#8a6aaa; background:#f8f4ff; }
  .cat-btn.house.active  { border-color:#7733aa; color:#7733aa; background:#e8dcf6; }
  .cat-btn.exer   { border-color:#e8d0b8; color:#c09878; background:#fff8f4; }
  .cat-btn.exer.active   { border-color:#cc6622; color:#cc6622; background:#ffe8d8; }
  .cat-btn.charge { border-color:#bcd0bc; color:#8aaa8a; background:#f5faf5; }
  .cat-btn.charge.active { border-color:#338833; color:#338833; background:#dcf0dc; }
  .cat-btn.ent    { border-color:#ecc8c8; color:#c08888; background:#fff4f4; }
  .cat-btn.ent.active    { border-color:#cc3333; color:#cc3333; background:#ffe0e0; }
  .cat-btn.idle   { border-color:#dcdcdc; color:#b0b0b0; background:#fafafa; }
  .cat-btn.idle:hover { border-color:#c0c0c0; }
  .cat-btn.record-stop { flex:0.8; background:#ffe8e8; border-color:#e8c0c0; color:#c04040; font-weight:600; }
  .cat-btn.record-stop .emoji { font-size:17px; }

  .date-nav { display:flex; align-items:center; justify-content:center; gap:12px; padding:4px 0 8px; font-size:15px; font-weight:700; }
  .date-nav .arrow { width:28px; height:28px; border-radius:50%; border:1px solid #e5e7eb; background:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; color:#6b7280; }

  .tl-header { display:flex; margin-bottom:4px; align-items:stretch; }
  .tl-header .h-plan { flex:1; text-align:center; padding:5px 0; font-size:12px; font-weight:600; border-radius:8px; background:#f5f8ff; color:#8a98b4; margin-right:2px; }
  .tl-header .h-axis { width:42px; flex-shrink:0; }
  .tl-header .h-rec  { flex:1; text-align:center; padding:5px 0; font-size:12px; font-weight:600; border-radius:8px; background:#f5faf5; color:#8aaa8a; margin-left:2px; }

  .viewport { overflow-y:auto; position:relative; border-radius:0 0 8px 8px; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.03); }
  .viewport::-webkit-scrollbar { width:4px; }
  .viewport::-webkit-scrollbar-thumb { background:#e5e7eb; border-radius:2px; }

  .timeline-wrap { display:flex; position:relative; }
  .plan-col { flex:1; position:relative; border-right:1px solid #e5e7eb; margin-right:2px; }
  .time-axis { width:38px; flex-shrink:0; position:relative; }
  .time-label { position:absolute; left:50%; transform:translate(-50%,-6px); font-size:9px; color:#9ca3af; white-space:nowrap; }
  .record-col { flex:1; position:relative; border-left:1px solid #e5e7eb; margin-left:2px; }

  .block { position:absolute; left:4px; right:4px; border-radius:7px; padding:4px 8px; font-size:11px; display:flex; align-items:center; gap:5px; overflow:hidden; min-height:36px; }
  .block .time-inner { margin-left:auto; opacity:.7; font-size:10px; white-space:nowrap; }

  .plan-work        { background:#f5f8ff; border:1.5px dashed #c8d4ec; color:#8a98b4; }
  .plan-house       { background:#f8f4ff; border:1.5px dashed #d4c8e8; color:#a090b8; }
  .plan-exercise    { background:#fff8f4; border:1.5px dashed #e8d0b8; color:#c09878; }
  .plan-charge      { background:#f5faf5; border:1.5px dashed #bcd0bc; color:#8aaa8a; }
  .plan-entertain   { background:#fff4f4; border:1.5px dashed #ecc8c8; color:#c08888; }
  .plan-idle        { background:#fafafa; border:1.5px dashed #dcdcdc; color:#b0b0b0; }

  .rec-work         { background:#d0e0ff; color:#1a3a6a; border-left:3px solid #3366cc; }
  .rec-house        { background:#e0d0f4; color:#4a2a6a; border-left:3px solid #7733aa; }
  .rec-exercise     { background:#ffe0c8; color:#804020; border-left:3px solid #cc6622; }
  .rec-charge       { background:#c8e8c8; color:#1a4a1a; border-left:3px solid #338833; }
  .rec-entertain    { background:#ffd0d0; color:#701818; border-left:3px solid #cc3333; }

  .now-line { position:absolute; left:0; right:0; height:2px; background:#ef4444; z-index:10; }
  .now-label { position:absolute; font-size:10px; color:#ef4444; font-weight:700; z-index:11; }
  .gap { position:absolute; left:4px; right:4px; border-radius:4px; font-size:9px; color:#d1d5db; display:flex; align-items:center; justify-content:center; border:1px dashed #eee; background:#fafafa; }

  .legend { margin-top:10px; display:flex; flex-wrap:wrap; gap:5px 10px; font-size:10px; color:#9ca3af; justify-content:center; }
  .legend span { display:flex; align-items:center; gap:3px; }
  .legend .dot { width:8px; height:8px; border-radius:2px; display:inline-block; }
  .dot.w{background:#3366cc}.dot.c{background:#338833}.dot.h{background:#7733aa}.dot.e{background:#cc6622}.dot.n{background:#cc3333}.dot.i{background:#ccc}
</style>
</head>
<body>
<div class="container">
  <div class="mode-toggle">
    <button class="active" onclick="switchMode('plan')">📋 计划</button>
    <button onclick="switchMode('record')">⏱️ 记录</button>
  </div>

  <!-- Top block — switches content -->
  <div class="top-block" id="topBlock">
    <div class="status-row"><span class="icon">📋</span><span class="text">当前计划</span></div>
    <div class="plan-info"><span class="plan-emoji">💼</span><span class="plan-detail">工作/学习</span><span class="plan-time">17:20 – 18:20 · 剩余 58分钟</span></div>
    <div class="plan-tip">固定 1 小时 · 不可编辑 · 新计划自动截断上一个</div>
    <div class="progress-bar"><div class="fill" style="width:3%"></div></div>
    <button class="end-btn">⏹️ 结束当前计划</button>
  </div>

  <!-- Category buttons — switches content -->
  <div class="cat-row" id="catRow">
    <button class="cat-btn work active"><span class="emoji">💼</span>工作</button>
    <button class="cat-btn house"><span class="emoji">🏠</span>家务</button>
    <button class="cat-btn exer"><span class="emoji">🏃</span>锻炼</button>
    <button class="cat-btn charge"><span class="emoji">🔋</span>充电</button>
    <button class="cat-btn ent"><span class="emoji">📱</span>消遣</button>
    <button class="cat-btn idle"><span class="emoji">🕊️</span>空闲</button>
  </div>

  <div class="date-nav">
    <div class="arrow">←</div>
    <div>2026.07.31 周五</div>
    <div class="arrow">→</div>
    <button style="font-size:11px;padding:2px 8px;border-radius:4px;border:1px solid #e5e7eb;background:#fff;color:#4A90D9;cursor:pointer;">今天</button>
  </div>

  <div class="tl-header">
    <div class="h-plan">计划</div>
    <div class="h-axis"></div>
    <div class="h-rec">记录</div>
  </div>
  <div class="viewport" id="viewport">
    <div class="timeline-wrap">
      <div class="plan-col" id="planCol"></div>
      <div class="time-axis" id="axis"></div>
      <div class="record-col" id="recordCol"></div>
    </div>
  </div>

  <div class="legend">
    <span><span class="dot w"></span>工作/学习</span>
    <span><span class="dot c"></span>充电</span>
    <span><span class="dot h"></span>家务</span>
    <span><span class="dot e"></span>锻炼</span>
    <span><span class="dot n"></span>消遣</span>
    <span><span class="dot i"></span>空闲</span>
  </div>
</div>

<script>
function switchMode(mode) {
  const btns = document.querySelectorAll('.mode-toggle button');
  const topBlock = document.getElementById('topBlock');
  const catRow = document.getElementById('catRow');

  if (mode === 'plan') {
    btns[0].classList.add('active'); btns[1].classList.remove('active');
    topBlock.innerHTML = '<div class="status-row"><span class="icon">📋</span><span class="text">当前计划</span></div><div class="plan-info"><span class="plan-emoji">💼</span><span class="plan-detail">工作/学习</span><span class="plan-time">17:20 – 18:20 · 剩余 58分钟</span></div><div class="plan-tip">固定 1 小时 · 不可编辑 · 新计划自动截断上一个</div><div class="progress-bar"><div class="fill" style="width:3%"></div></div><button class="end-btn">⏹️ 结束当前计划</button>';
    catRow.innerHTML = `
      <button class="cat-btn work active"><span class="emoji">💼</span>工作</button>
      <button class="cat-btn house"><span class="emoji">🏠</span>家务</button>
      <button class="cat-btn exer"><span class="emoji">🏃</span>锻炼</button>
      <button class="cat-btn charge"><span class="emoji">🔋</span>充电</button>
      <button class="cat-btn ent"><span class="emoji">📱</span>消遣</button>
      <button class="cat-btn idle"><span class="emoji">🕊️</span>空闲</button>`;
  } else {
    btns[1].classList.add('active'); btns[0].classList.remove('active');
    topBlock.innerHTML = '<div class="status-row"><span class="icon">⏱️</span><span class="text">正在记录</span></div><div class="record-timer">03:37:48</div><div class="record-cat"><span>💼</span> 工作/学习</div><button class="end-btn">⏹️ 停止记录</button>';
    catRow.innerHTML = `
      <button class="cat-btn work"><span class="emoji">💼</span>工作</button>
      <button class="cat-btn house"><span class="emoji">🏠</span>家务</button>
      <button class="cat-btn exer"><span class="emoji">🏃</span>锻炼</button>
      <button class="cat-btn charge"><span class="emoji">🔋</span>充电</button>
      <button class="cat-btn ent"><span class="emoji">📱</span>消遣</button>
      <button class="cat-btn record-stop"><span class="emoji">⏸️</span>停止</button>`;
  }
}

const PX_PER_MIN = 2.2;
const START_HOUR = 6;
const END_HOUR = 22;
const TOTAL_MIN = (END_HOUR - START_HOUR) * 60;
const TOTAL_PX = TOTAL_MIN * PX_PER_MIN;

const plans = [
  { cat:'💼', label:'工作', start:'07:00', end:'08:00', cls:'plan-work' },
  { cat:'🕊️', label:'空闲', start:'08:00', end:'11:00', cls:'plan-idle' },
  { cat:'💼', label:'工作', start:'11:00', end:'12:00', cls:'plan-work' },
  { cat:'🕊️', label:'空闲', start:'12:00', end:'14:00', cls:'plan-idle' },
  { cat:'🔋', label:'充电', start:'14:00', end:'15:00', cls:'plan-charge' },
];
const records = [
  { cat:'💼', label:'工作/学习', start:'07:00', end:'08:12', cls:'rec-work' },
  { cat:'📱', label:'消遣',  start:'09:48', end:'10:31', cls:'rec-entertain' },
  { cat:'💼', label:'工作/学习', start:'11:00', end:'12:01', cls:'rec-work' },
  { cat:'🏠', label:'家务',    start:'12:35', end:'12:52', cls:'rec-house' },
  { cat:'🔋', label:'充电',    start:'13:02', end:'13:48', cls:'rec-charge' },
];

function timeToMin(t) { const [h,m]=t.split(':').map(Number); return (h-START_HOUR)*60+m; }
function timeToPx(t) { return Math.max(0, timeToMin(t) * PX_PER_MIN); }
function minToPx(m) { return m * PX_PER_MIN; }

const allStarts = [...plans.map(p=>timeToMin(p.start)), ...records.map(r=>timeToMin(r.start))];
const allEnds   = [...plans.map(p=>timeToMin(p.end)),   ...records.map(r=>timeToMin(r.end))];
const firstMin = Math.min(...allStarts);
const nowMin = timeToMin('14:30');
const viewEndMin = Math.max(nowMin, Math.max(...allEnds)) + 15;

const axis = document.getElementById('axis');
axis.style.height = TOTAL_PX + 'px';
for (let h = START_HOUR; h <= END_HOUR; h++) {
  const top = (h - START_HOUR) * 60 * PX_PER_MIN;
  const el = document.createElement('div');
  el.className = 'time-label';
  el.style.top = top + 'px';
  el.textContent = String(h).padStart(2,'0')+':00';
  axis.appendChild(el);
}

const planCol = document.getElementById('planCol');
planCol.style.height = TOTAL_PX + 'px';
plans.forEach(p => {
  const top = timeToPx(p.start);
  const h = timeToPx(p.end) - top;
  const el = document.createElement('div');
  el.className = 'block ' + p.cls;
  el.style.top = top+'px';
  el.style.height = h+'px';
  el.innerHTML = `${p.cat} ${p.label}<span class="time-inner">${p.start}–${p.end}</span>`;
  planCol.appendChild(el);
});
let pPrev = 0;
plans.forEach(p => {
  const s = timeToMin(p.start);
  const dur = s - pPrev;
  if (dur >= 5) {
    const el = document.createElement('div');
    el.className = 'gap';
    el.style.top = minToPx(pPrev)+'px';
    el.style.height = minToPx(dur)+'px';
    const m = Math.round(dur);
    el.textContent = m>=60?`${Math.floor(m/60)}h${m%60?' '+(m%60)+'m':''}`:`${m}m`;
    planCol.appendChild(el);
  }
  pPrev = timeToMin(p.end);
});

const recordCol = document.getElementById('recordCol');
recordCol.style.height = TOTAL_PX + 'px';
records.forEach(r => {
  const top = timeToPx(r.start);
  const h = timeToPx(r.end) - top;
  const el = document.createElement('div');
  el.className = 'block ' + r.cls;
  el.style.top = top+'px';
  el.style.height = h+'px';
  el.innerHTML = `${r.cat} ${r.label}<span class="time-inner">${r.start}–${r.end}</span>`;
  recordCol.appendChild(el);
});
let prevEnd = 0;
records.forEach(r => {
  const s = timeToMin(r.start);
  const dur = s - prevEnd;
  if (dur >= 5) {
    const el = document.createElement('div');
    el.className = 'gap';
    el.style.top = minToPx(prevEnd)+'px';
    el.style.height = minToPx(dur)+'px';
    const m = Math.round(dur);
    el.textContent = m>=60?`${Math.floor(m/60)}h${m%60?' '+(m%60)+'m':''}`:`${m}m`;
    recordCol.appendChild(el);
  }
  prevEnd = timeToMin(r.end);
});
if (TOTAL_MIN - prevEnd >= 5) {
  const dur = TOTAL_MIN - prevEnd;
  const el = document.createElement('div');
  el.className = 'gap';
  el.style.top = minToPx(prevEnd)+'px';
  el.style.height = minToPx(dur)+'px';
  el.textContent = dur>=60?`${Math.floor(dur/60)}h${dur%60?' '+(dur%60)+'m':''}`:`${Math.round(dur)}m`;
  recordCol.appendChild(el);
}

const nowPx = timeToPx('14:30');
['planCol','recordCol'].forEach(id => {
  const nl = document.createElement('div');
  nl.className = 'now-line';
  nl.style.top = nowPx+'px';
  document.getElementById(id).appendChild(nl);
});
const nowLabel = document.createElement('div');
nowLabel.className = 'now-label';
nowLabel.style.top = (nowPx-7)+'px';
nowLabel.textContent = 'NOW';
axis.appendChild(nowLabel);

const viewport = document.getElementById('viewport');
const viewH = Math.min(420, minToPx(viewEndMin - firstMin) + 60);
viewport.style.height = viewH + 'px';
viewport.scrollTop = minToPx(firstMin) - 16;
</script>
</body>
</html>
