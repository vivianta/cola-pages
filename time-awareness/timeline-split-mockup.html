<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>左右分栏时间线 — 原型</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background:#f8f9fa; padding:16px; color:#333; }
  .container { max-width:480px; margin:0 auto; }

  .header { display:flex; margin-bottom:8px; }
  .header .col { flex:1; text-align:center; padding:6px 0; font-size:13px; font-weight:600; border-radius:8px; }
  .header .plan-col { background:#f0f4ff; color:#7b8ba8; margin-right:4px; }
  .header .record-col { background:#f0f9f0; color:#6b8a6b; margin-left:4px; }

  .timeline-wrap { display:flex; position:relative; min-height:500px; }

  /* Time labels on left edge */
  .time-labels { width:40px; flex-shrink:0; position:relative; }
  .time-label { position:absolute; right:4px; font-size:10px; color:#9ca3af; transform:translateY(-6px); }

  /* Two columns */
  .plan-col, .record-col { flex:1; position:relative; border-left:1px solid #e5e7eb; padding:0 6px; }
  .record-col { margin-left:0; }
  .plan-col { margin-right:0; }

  .block { position:absolute; left:6px; right:6px; border-radius:8px; padding:6px 8px; font-size:11px; display:flex; align-items:center; gap:5px; overflow:hidden; min-height:36px; }
  .plan-block { background:#f0f4ff; border:1.5px dashed #c4d4f0; color:#7b8ba8; }
  .record-block { background:#e8f4e8; color:#5a7a5a; }
  .block .time-inner { margin-left:auto; opacity:.7; font-size:10px; white-space:nowrap; }

  /* Category colors for records */
  .rec-work { background:#e8f0ff; color:#4a6fa5; }
  .rec-house { background:#e8f8e8; color:#5a8a5a; }
  .rec-exercise { background:#fff0e8; color:#c07840; }
  .rec-charge { background:#f0e8ff; color:#7a5a9a; }
  .rec-entertainment { background:#ffe8e8; color:#c04848; }

  /* NOW line */
  .now-line { position:absolute; left:0; right:0; height:2px; background:#ef4444; z-index:10; }
  .now-line::before { content:'NOW'; position:absolute; right:100%; margin-right:4px; top:-7px; font-size:10px; color:#ef4444; font-weight:700; }

  /* Gap indicators */
  .gap { position:absolute; left:6px; right:6px; border-radius:4px; font-size:9px; color:#d1d5db; display:flex; align-items:center; justify-content:center; border:1px dashed #eee; background:#fafafa; }

  .note { margin-top:20px; font-size:12px; text-align:center; color:#9ca3af; line-height:1.6; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="col plan-col">📋 计划</div>
    <div class="col record-col">⏱️ 记录</div>
  </div>

  <div class="timeline-wrap" id="wrapper">
    <!-- Time labels -->
    <div class="time-labels" id="labels"></div>
    <!-- Plan column -->
    <div class="plan-col" id="planCol"></div>
    <!-- Record column -->
    <div class="record-col" id="recordCol"></div>
  </div>

  <div class="note">
    左右时间严格对齐。左边计划（虚线框），右边实际记录（实色块）。<br>
    不重合 — 各管各的，对比一目了然。
  </div>
</div>

<script>
const PX_PER_MIN = 2.2;
const START_HOUR = 6;
const END_HOUR = 22;
const TOTAL_MIN = (END_HOUR - START_HOUR) * 60;
const TOTAL_PX = TOTAL_MIN * PX_PER_MIN;

// Sample data
const plans = [
  { cat:'💼', label:'工作', start:'07:00', end:'08:00', color:'work' },
  { cat:'💼', label:'工作', start:'11:00', end:'12:00', color:'work' },
  { cat:'🔋', label:'充电', start:'14:00', end:'15:00', color:'charge' },
];

const records = [
  { cat:'💼', label:'工作/学习', start:'07:00', end:'08:12', color:'rec-work' },
  { cat:'📱', label:'消遣', start:'09:48', end:'10:31', color:'rec-entertainment' },
  { cat:'💼', label:'工作/学习', start:'11:00', end:'12:01', color:'rec-work' },
  { cat:'🏠', label:'家务', start:'12:35', end:'12:52', color:'rec-house' },
  { cat:'🔋', label:'充电', start:'13:02', end:'13:48', color:'rec-charge' },
];

function timeToMin(t) { const [h,m]=t.split(':').map(Number); return (h-START_HOUR)*60+m; }
function timeToPx(t) { return Math.max(0, timeToMin(t) * PX_PER_MIN); }

// Generate time labels
const labelsEl = document.getElementById('labels');
labelsEl.style.height = TOTAL_PX + 'px';
for (let h = START_HOUR; h <= END_HOUR; h++) {
  const top = (h - START_HOUR) * 60 * PX_PER_MIN;
  const el = document.createElement('div');
  el.className = 'time-label';
  el.style.top = top + 'px';
  el.textContent = String(h).padStart(2,'0')+':00';
  labelsEl.appendChild(el);
}

// Draw plan blocks
const planCol = document.getElementById('planCol');
planCol.style.height = TOTAL_PX + 'px';

// Draw dashed fill for empty plan periods
plans.forEach(p => {
  const top = timeToPx(p.start);
  const h = timeToPx(p.end) - top;
  const el = document.createElement('div');
  el.className = 'block plan-block';
  el.style.top = top+'px';
  el.style.height = h+'px';
  el.innerHTML = `${p.cat} ${p.label}<span class="time-inner">${p.start}–${p.end}</span>`;
  planCol.appendChild(el);
});

// Draw NOW line
const nowPx = timeToPx('14:30');
const nowEl = document.createElement('div');
nowEl.className = 'now-line';
nowEl.style.top = nowPx+'px';
planCol.appendChild(nowEl);

// Draw record blocks
const recordCol = document.getElementById('recordCol');
recordCol.style.height = TOTAL_PX + 'px';
const nowEl2 = nowEl.cloneNode(true);
recordCol.appendChild(nowEl2);

records.forEach(r => {
  const top = timeToPx(r.start);
  const h = timeToPx(r.end) - top;
  const el = document.createElement('div');
  el.className = 'block record-block ' + r.color;
  el.style.top = top+'px';
  el.style.height = h+'px';
  el.innerHTML = `${r.cat} ${r.label}<span class="time-inner">${r.start}–${r.end}</span>`;
  recordCol.appendChild(el);
});

// Gaps (empty spaces) on record side
const recGaps = [];
if (records.length > 0) {
  const dayStartMin = 0;
  const dayEndMin = TOTAL_MIN;
  let prevEnd = dayStartMin;
  records.forEach(r => {
    const s = timeToMin(r.start);
    if (s > prevEnd) recGaps.push({start:prevEnd, end:s});
    prevEnd = timeToMin(r.end);
  });
  if (prevEnd < dayEndMin) recGaps.push({start:prevEnd, end:dayEndMin});
}

recGaps.forEach(g => {
  const dur = g.end - g.start;
  if (dur < 5) return;
  const top = g.start * PX_PER_MIN;
  const h = dur * PX_PER_MIN;
  const el = document.createElement('div');
  el.className = 'gap';
  el.style.top = top+'px';
  el.style.height = h+'px';
  const mins = Math.round(dur);
  el.textContent = mins >= 60 ? `${Math.floor(mins/60)}h${mins%60 ? ' '+(mins%60)+'m':''}` : `${mins}m`;
  recordCol.appendChild(el);
});
</script>
</body>
</html>
