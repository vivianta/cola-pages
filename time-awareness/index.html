<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>时间知觉</title>
<style>
:root {
  --work: #4A90D9;      --work-bg: #EDF4FC;    --work-light: #DBEAFE;
  --chores: #4CAF84;    --chores-bg: #EDF8F1;  --chores-light: #D1FAE5;
  --exercise: #F09B4A;  --exercise-bg: #FEF6EE; --exercise-light: #FED7AA;
  --recharge: #8B7EC8;  --recharge-bg: #F4F2FA; --recharge-light: #E0D9F5;
  --entertainment: #E0687A; --entertainment-bg: #FDF0F3; --entertainment-light: #FECDD3;
  --unrecorded: #9CA3AF; --unrecorded-bg: #F3F4F6;
  --sync: #10B981;
  --bg: #FAF9F7;
  --surface: #FFFFFF;
  --text: #2D2D2D;
  --text-secondary: #6B7280;
  --text-muted: #9CA3AF;
  --border: #E5E7EB;
  --radius: 14px; --radius-sm: 10px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.container { max-width: 520px; margin: 0 auto; padding: 16px 16px 100px; }

.header { text-align: center; padding: 8px 0 12px; }
.header .date { font-size: 15px; color: var(--text-secondary); font-weight: 500; }
.header .weekday { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
.sync-indicator {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; color: var(--text-muted); margin-top: 4px; cursor: pointer;
}
.sync-indicator .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); }
.sync-indicator.synced .dot { background: var(--sync); }
.sync-indicator.error .dot { background: var(--entertainment); }
.sync-indicator.syncing .dot { animation: blink 0.6s infinite; background: #F59E0B; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

.mode-toggle {
  display: flex; gap: 0; background: var(--surface); border-radius: var(--radius);
  padding: 4px; margin-bottom: 16px; box-shadow: var(--shadow);
}
.mode-btn {
  flex: 1; padding: 10px; border: none; background: transparent; border-radius: var(--radius-sm);
  font-size: 15px; font-weight: 600; cursor: pointer; font-family: var(--font);
  transition: all 0.15s; color: var(--text-muted);
}
.mode-btn.active { background: var(--text); color: white; }

.status-card {
  background: var(--surface); border-radius: var(--radius); padding: 16px 20px;
  margin-bottom: 16px; box-shadow: var(--shadow); text-align: center;
  border: 2px solid transparent; transition: all 0.3s;
}
.status-card.active { border-color: var(--border); }
.status-card .status-label { font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
.status-card .status-main { font-size: 17px; font-weight: 700; }
.status-card .status-time { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
.status-card .status-bar {
  height: 4px; background: var(--bg); border-radius: 2px; margin-top: 12px; overflow: hidden;
}
.status-card .status-bar-fill { height: 100%; border-radius: 2px; transition: width 1s linear; }
.status-card.empty .status-main { color: var(--text-muted); font-size: 15px; font-weight: 500; }
.status-card .stop-btn {
  margin-top: 10px; font-size: 12px; padding: 5px 14px; border: 1.5px solid var(--border);
  border-radius: 20px; background: var(--surface); color: var(--text-secondary);
  cursor: pointer; font-family: var(--font); font-weight: 600;
}

.category-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px;
}
.cat-btn {
  background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius);
  padding: 14px 8px; text-align: center; cursor: pointer; transition: all 0.15s;
  box-shadow: var(--shadow); position: relative;
}
.cat-btn:active { transform: scale(0.97); }
.cat-btn .cat-icon { font-size: 26px; display: block; margin-bottom: 4px; }
.cat-btn .cat-name { font-size: 13px; font-weight: 600; color: var(--text); }
.cat-btn.active { transform: scale(1.03); box-shadow: var(--shadow-md); }
.cat-btn.work.active { border-color: var(--work); background: var(--work-bg); }
.cat-btn.chores.active { border-color: var(--chores); background: var(--chores-bg); }
.cat-btn.exercise.active { border-color: var(--exercise); background: var(--exercise-bg); }
.cat-btn.recharge.active { border-color: var(--recharge); background: var(--recharge-bg); }
.cat-btn.entertainment.active { border-color: var(--entertainment); background: var(--entertainment-bg); }
.cat-btn.unrecorded.active { border-color: var(--unrecorded); background: var(--unrecorded-bg); }

.cat-btn.entertainment.alerting {
  animation: alertPulse 0.8s ease-in-out infinite;
  border-color: #E04050;
}
@keyframes alertPulse {
  0%, 100% { background: var(--entertainment-bg); }
  50% { background: #FEE2E5; }
}

.tabs {
  display: flex; gap: 4px; background: var(--surface); border-radius: var(--radius);
  padding: 4px; margin-bottom: 16px; box-shadow: var(--shadow);
}
.tab-btn {
  flex: 1; padding: 10px; border: none; background: transparent; border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 600; color: var(--text-muted); cursor: pointer;
  font-family: var(--font); transition: all 0.15s;
}
.tab-btn.active { background: var(--text); color: white; }

.tab-panel { display: none; }
.tab-panel.active { display: block; }

.timeline { display: flex; flex-direction: column; gap: 8px; }
.timeline-entry {
  background: var(--surface); border-radius: var(--radius-sm); padding: 12px 14px;
  box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px;
  border-left: 4px solid transparent; position: relative;
}
.timeline-entry.plan { border-left-style: dashed; }
.timeline-entry.record { border-left-style: solid; }
.timeline-entry.work { border-left-color: var(--work); }
.timeline-entry.chores { border-left-color: var(--chores); }
.timeline-entry.exercise { border-left-color: var(--exercise); }
.timeline-entry.recharge { border-left-color: var(--recharge); }
.timeline-entry.entertainment { border-left-color: var(--entertainment); }
.timeline-entry.unrecorded { border-left-color: var(--unrecorded); }

.timeline-entry .tl-badge {
  position: absolute; top: 6px; right: 10px; font-size: 10px; font-weight: 700;
  padding: 1px 7px; border-radius: 8px; letter-spacing: 0.5px;
}
.timeline-entry .tl-badge.plan { background: #EFF6FF; color: #3B82F6; }
.timeline-entry .tl-badge.record { background: #F0FDF4; color: #16A34A; }

.timeline-entry .tl-time { font-size: 13px; color: var(--text-secondary); min-width: 88px; font-variant-numeric: tabular-nums; }
.timeline-entry .tl-info { flex: 1; min-width: 0; }
.timeline-entry .tl-cat { font-size: 14px; font-weight: 600; }
.timeline-entry .tl-dur { font-size: 12px; color: var(--text-muted); }
.timeline-entry .tl-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
.timeline-entry:hover .tl-actions,
.timeline-entry:focus-within .tl-actions { opacity: 1; }
.tl-action-btn {
  width: 28px; height: 28px; border: none; background: var(--bg); border-radius: 6px;
  cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary);
}
.tl-action-btn:hover { background: #E5E7EB; }
.tl-action-btn.danger:hover { background: #FEE2E5; color: #E04050; }

.empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px; }
.empty-state .empty-icon { font-size: 40px; margin-bottom: 8px; }
.empty-state .empty-sub { font-size: 12px; margin-top: 4px; }

.stats-section { margin-bottom: 20px; }
.stats-section h3 { font-size: 14px; color: var(--text-secondary); margin-bottom: 10px; font-weight: 600; }
.stats-summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
.stat-card {
  background: var(--surface); border-radius: var(--radius-sm); padding: 14px;
  box-shadow: var(--shadow); text-align: center;
}
.stat-card .stat-cat { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
.stat-card .stat-val { font-size: 22px; font-weight: 700; }
.stat-card .stat-pct { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

.bar-chart { display: flex; flex-direction: column; gap: 6px; }
.bar-row { display: flex; align-items: center; gap: 10px; }
.bar-label { width: 72px; font-size: 13px; font-weight: 600; text-align: right; flex-shrink: 0; }
.bar-track { flex: 1; height: 22px; background: var(--bg); border-radius: 6px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 6px; transition: width 0.4s ease; min-width: 2px; }
.bar-val { width: 50px; font-size: 12px; color: var(--text-secondary); flex-shrink: 0; }

.plan-vs-record { margin-top: 16px; }
.pvr-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.pvr-label { width: 72px; font-size: 13px; font-weight: 600; text-align: right; flex-shrink: 0; }
.pvr-bars { flex: 1; display: flex; flex-direction: column; gap: 3px; }
.pvr-track { height: 18px; background: var(--bg); border-radius: 6px; overflow: hidden; }
.pvr-fill { height: 100%; border-radius: 6px; }

/* ===== Stats V2 ===== */
.stats-v2-subtitle { font-size:13px; color:var(--text-muted); margin-bottom:24px; }
.stats-v2-summary { background:var(--surface); border-radius:var(--radius); padding:24px; margin-bottom:20px; display:flex; align-items:center; gap:24px; box-shadow:var(--shadow); }
.stats-v2-donut { position:relative; width:120px; height:120px; flex-shrink:0; }
.stats-v2-donut svg { width:120px; height:120px; transform:rotate(-90deg); }
.stats-v2-donut-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.stats-v2-donut-center .big { font-size:28px; font-weight:700; letter-spacing:-1px; color:var(--text); }
.stats-v2-donut-center .label { font-size:11px; color:var(--text-muted); }
.stats-v2-summary-side { flex:1; min-width:0; }
.stats-v2-summary-row { display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:13px; color:var(--text-secondary); }
.stats-v2-summary-row .val { font-weight:600; color:var(--text); }
.stats-v2-divider { height:1px; background:#f3f4f6; margin:8px 0; }
.stats-v2-completion { display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; }
.stats-v2-completion.good { color:var(--chores); }
.stats-v2-completion.warn { color:var(--exercise); }
.stats-v2-completion .arrow { font-size:16px; }
.stats-v2-section-title { font-size:14px; font-weight:600; margin-bottom:12px; }
.stats-v2-cat-row { background:var(--surface); border-radius:var(--radius-sm); padding:14px 16px; margin-bottom:8px; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow); }
.stats-v2-cat-row .icon { font-size:22px; width:28px; text-align:center; flex-shrink:0; }
.stats-v2-cat-row .info { flex:1; min-width:0; }
.stats-v2-cat-row .name { font-size:14px; font-weight:600; margin-bottom:4px; }
.stats-v2-cat-row .time-row { display:flex; gap:12px; font-size:12px; color:var(--text-secondary); }
.stats-v2-cat-row .time-row span { white-space:nowrap; }
.stats-v2-cat-row .bar-wrap { width:60px; flex-shrink:0; }
.stats-v2-cat-row .bar-track { height:6px; background:#f3f4f6; border-radius:3px; overflow:hidden; margin-bottom:2px; }
.stats-v2-cat-row .bar-fill { height:100%; border-radius:3px; transition:width 0.4s ease; }
.stats-v2-cat-row .bar-pct { font-size:11px; font-weight:600; text-align:right; }
.stats-v2-unplanned { background:#fff5f5; border:1px solid #fecdd3; border-radius:var(--radius-sm); padding:14px 16px; margin-bottom:8px; font-size:13px; color:var(--entertainment); display:flex; align-items:center; gap:8px; }
.stats-v2-unplanned .icon { font-size:20px; flex-shrink:0; }
.stats-v2-legend { margin-top:20px; display:flex; gap:16px; font-size:12px; color:var(--text-muted); flex-wrap:wrap; }
.stats-v2-legend .dot { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; }
.stats-v2-empty { text-align:center; padding:40px 20px; color:var(--text-muted); font-size:14px; }
.stats-v2-empty .icon { font-size:40px; margin-bottom:8px; }
.stats-v2-empty .sub { font-size:12px; margin-top:4px; color:var(--text-muted); }
@media (max-width:380px) {
  .stats-v2-summary { flex-direction:column; align-items:center; text-align:center; }
  .stats-v2-donut { width:100px; height:100px; }
  .stats-v2-donut svg { width:100px; height:100px; }
  .stats-v2-summary-side { width:100%; }
}

.settings-section { margin-bottom: 20px; }
.settings-section h3 { font-size: 14px; color: var(--text-secondary); margin-bottom: 10px; font-weight: 600; }
.settings-section .hint { font-size: 12px; color: var(--text-muted); margin-top: 6px; line-height: 1.5; }
.btn {
  padding: 10px 20px; border: none; border-radius: var(--radius-sm); font-size: 14px;
  font-weight: 600; cursor: pointer; font-family: var(--font); transition: all 0.15s;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--text); color: white; }
.btn-secondary { background: var(--surface); color: var(--text); border: 1.5px solid var(--border); box-shadow: var(--shadow); }
.btn-sync { background: var(--sync); color: white; }
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

.input-row { display: flex; gap: 8px; }
.input-row input {
  flex: 1; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  font-size: 14px; font-family: var(--font); background: var(--bg); color: var(--text);
}
.input-row input:focus { outline: none; border-color: var(--work); }

.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  display: flex; align-items: flex-end; justify-content: center; z-index: 100;
  animation: fadeIn 0.15s;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-sheet {
  background: var(--surface); border-radius: 20px 20px 0 0; padding: 24px;
  width: 100%; max-width: 520px; animation: slideUp 0.2s;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-sheet h3 { font-size: 17px; margin-bottom: 16px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; font-weight: 500; }
.form-group input, .form-group select {
  width: 100%; padding: 10px 12px; border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); font-size: 15px; font-family: var(--font);
  background: var(--bg); color: var(--text);
}
.form-group input:focus, .form-group select:focus { outline: none; border-color: var(--work); }

.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: var(--text); color: white; padding: 10px 24px; border-radius: 20px;
  font-size: 14px; font-weight: 600; z-index: 200;
  animation: toastIn 0.2s, toastOut 0.2s 1.8s forwards;
}
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } }
@keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(10px); } }

@media (max-width: 400px) {
  .cat-btn { padding: 12px 6px; }
  .cat-btn .cat-icon { font-size: 22px; }
  .cat-btn .cat-name { font-size: 12px; }
}

/* ===== Timeline V2 — Vertical Overlay ===== */
.timeline-v2 { position: relative; }

.tl-v2-hour {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; color: var(--text-muted);
  padding: 8px 0 4px 0; margin-bottom: 2px;
}
.tl-v2-hour::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--border); flex-shrink: 0;
}
.tl-v2-hour::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}

.tl-v2-track {
  position: relative; border-radius: 12px;
  margin-bottom: 8px; overflow: visible;
}

/* Plan layer (background) */
.tl-v2-plan {
  border-radius: 12px; padding: 10px 14px; min-height: 46px;
  border: 2px dashed; display: flex; align-items: center;
  gap: 6px; font-size: 13px; flex-wrap: wrap;
}
.tl-v2-plan .tl-v2-time { font-size: 11px; opacity: 0.7; }
.tl-v2-plan .tl-v2-dur { color: inherit; opacity: 0.6; font-size: 12px; font-weight: 600; white-space: nowrap; }

/* Actual layer (foreground, overlaid) */
.tl-v2-actual {
  border-radius: 10px; padding: 10px 14px; min-height: 38px;
  color: #fff; display: flex; align-items: center;
  gap: 6px; font-size: 13px; flex-wrap: wrap;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.tl-v2-actual .tl-v2-time { font-size: 11px; opacity: 0.85; }
.tl-v2-actual .tl-v2-dur { font-size: 12px; font-weight: 600; white-space: nowrap; }

/* No-edit label */
.tl-v2-noedit {
  font-size: 11px; color: var(--text-muted); opacity: 0.5;
  white-space: nowrap;
}

/* Action buttons (hover reveal) */
.tl-v2-actions {
  display: flex; gap: 2px; opacity: 0;
  transition: opacity 0.15s; flex-shrink: 0;
}
.tl-v2-track:hover .tl-v2-actions,
.tl-v2-track:focus-within .tl-v2-actions { opacity: 1; }

/* ===== Block type variants ===== */

/* Overlap: plan behind, actual overlaid on top */
.tl-v2-track.overlap { position: relative; }
.tl-v2-track.overlap .tl-v2-plan { padding-bottom: 14px; }
.tl-v2-track.overlap .tl-v2-actual {
  position: absolute; left: 4px; right: 4px;
}

/* Plan-only: muted empty-plan style */
.tl-v2-track.plan-only .tl-v2-plan {
  border-style: dashed; border-color: var(--border);
  background: #f9fafb; color: var(--text-muted);
}
.tl-v2-track.plan-only .tl-v2-actual { display: none; }

/* Record-only: standalone solid block */
.tl-v2-track.record-only .tl-v2-plan { display: none; }
.tl-v2-track.record-only .tl-v2-actual {
  position: static; border-radius: 12px;
}

/* ===== Category color mapping ===== */
.tl-v2-track.work .tl-v2-plan { border-color: #c4d4f0; background: var(--work-bg); }
.tl-v2-track.work .tl-v2-actual { background: var(--work); }

.tl-v2-track.chores .tl-v2-plan { border-color: #b8dcc8; background: var(--chores-bg); }
.tl-v2-track.chores .tl-v2-actual { background: var(--chores); }

.tl-v2-track.exercise .tl-v2-plan { border-color: #f0d4a8; background: var(--exercise-bg); }
.tl-v2-track.exercise .tl-v2-actual { background: var(--exercise); }

.tl-v2-track.recharge .tl-v2-plan { border-color: #d0c8f0; background: var(--recharge-bg); }
.tl-v2-track.recharge .tl-v2-actual { background: var(--recharge); }

.tl-v2-track.entertainment .tl-v2-plan { border-color: #f5c4ce; background: var(--entertainment-bg); }
.tl-v2-track.entertainment .tl-v2-actual { background: var(--entertainment); }

.tl-v2-track.unrecorded .tl-v2-actual { background: var(--unrecorded); }

/* ===== Gap / idle indicator ===== */
.tl-v2-gap {
  margin-bottom: 8px; padding: 6px 14px; border-radius: 8px;
  background: #fafafa; border: 1px dashed var(--border);
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--text-muted);
}
.tl-v2-gap-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--border); flex-shrink: 0;
}

/* ===== NOW line ===== */
.tl-v2-now { position: relative; margin: 10px 0; }
.tl-v2-now-line {
  height: 2px; background: #ef4444; border-radius: 1px;
  position: relative;
}
.tl-v2-now-label {
  position: absolute; top: -8px; left: -44px;
  font-size: 10px; font-weight: 700; color: #ef4444;
  background: var(--bg); padding: 0 4px;
}
.tl-v2-now-line::after {
  content: ''; position: absolute; left: -4px; top: -3px;
  width: 8px; height: 8px; border-radius: 50%; background: #ef4444;
}

/* Ongoing pulse */
.tl-v2-track.ongoing .tl-v2-actual {
  animation: ongoingPulse 2s ease-in-out infinite;
}
@keyframes ongoingPulse {
  0%, 100% { box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
  50% { box-shadow: 0 2px 18px rgba(0,0,0,0.28); }
}

.tl-v2-track.plan-only.truncated .tl-v2-plan {
  border-style: dashed; border-color: var(--text-muted);
  background: #fafafa; opacity: 0.7;
}

@media (max-width: 400px) {
  .tl-v2-plan, .tl-v2-actual { font-size: 12px; padding: 8px 10px; }
  .tl-v2-dur { font-size: 11px; }
}

/* ===== Date Navigation ===== */
.date-nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 4px 0 8px; gap: 8px;
}
.nav-arrow {
  width: 36px; height: 36px; border: none; background: var(--surface);
  border-radius: 50%; font-size: 18px; cursor: pointer; display: flex;
  align-items: center; justify-content: center; box-shadow: var(--shadow);
  color: var(--text-secondary); transition: all 0.15s; flex-shrink: 0;
}
.nav-arrow:active { transform: scale(0.93); background: var(--bg); }
.date-center {
  flex: 1; text-align: center; cursor: pointer; user-select: none;
}
.date-center .date-full { font-size: 17px; font-weight: 700; color: var(--text); }
.date-center .date-weekday { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
.today-btn {
  padding: 6px 14px; font-size: 13px; font-weight: 600; border: 1.5px solid var(--border);
  border-radius: 20px; background: var(--surface); color: var(--text-secondary);
  cursor: pointer; font-family: var(--font); transition: all 0.15s; flex-shrink: 0;
}
.today-btn:active { background: var(--bg); }
.today-btn.is-today { opacity: 0.4; pointer-events: none; }

/* ===== 7-Day Strip ===== */
.week-strip {
  background: var(--surface); border-radius: var(--radius);
  padding: 14px 10px 10px; margin-bottom: 16px; box-shadow: var(--shadow);
}
.week-strip-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px; font-size: 12px;
}
.week-strip-header .label { color: var(--text-muted); font-weight: 500; }
.week-strip-header .total { color: var(--text-secondary); font-weight: 600; }
.week-strip-days { display: flex; gap: 6px; align-items: flex-end; }
.week-day {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 4px; cursor: pointer; padding: 4px 2px; border-radius: 8px;
  transition: background 0.15s;
}
.week-day:hover { background: var(--bg); }
.week-day.today { background: #F0F5FF; }
.week-day.selected { background: #E8F0FE; }
.tree-icon { width: 28px; height: 28px; flex-shrink: 0; }
.bar-col {
  width: 100%; max-width: 24px; min-height: 4px;
  background: #d1d5db; border-radius: 3px; transition: height 0.3s ease;
}
.week-day.today .bar-col { background: var(--work); }
.day-name { font-size: 11px; color: var(--text-muted); font-weight: 500; }
.week-day.today .day-name { color: var(--work); font-weight: 700; }
.day-dur { font-size: 10px; color: var(--text-muted); }
.week-day.today .day-dur { color: var(--work); font-weight: 600; }

/* ===== Calendar Overlay ===== */
.calendar-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.35);
  display: flex; align-items: center; justify-content: center;
  z-index: 150; animation: fadeIn 0.15s;
}
.calendar-popup {
  background: var(--surface); border-radius: var(--radius);
  padding: 20px; width: 320px; max-width: 90vw;
  box-shadow: var(--shadow-md); animation: slideUp 0.2s;
}
.calendar-popup .cal-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.calendar-popup .cal-header .cal-month-label {
  font-size: 15px; font-weight: 700;
}
.calendar-popup .cal-header button {
  width: 30px; height: 30px; border: none; background: var(--bg);
  border-radius: 50%; font-size: 16px; cursor: pointer; display: flex;
  align-items: center; justify-content: center; color: var(--text-secondary);
}
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-grid .cal-day-hdr {
  font-size: 11px; color: var(--text-muted); text-align: center;
  padding: 4px 0; font-weight: 600;
}
.cal-day {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  font-size: 13px; border-radius: 8px; cursor: pointer; color: var(--text);
  font-weight: 500; transition: background 0.1s;
}
.cal-day:hover { background: var(--bg); }
.cal-day.other-month { color: var(--text-muted); opacity: 0.4; }
.cal-day.today { background: #E8F0FE; font-weight: 700; color: var(--work); }
.cal-day.selected { background: var(--work); color: #fff; font-weight: 700; }

/* ===== Granularity Tabs ===== */
.granularity-tabs {
  display: inline-flex; gap: 2px; background: var(--bg);
  border-radius: var(--radius-sm); padding: 3px; margin-bottom: 14px;
}
.granularity-btn {
  padding: 6px 16px; border: none; background: transparent;
  border-radius: 8px; font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: var(--font); color: var(--text-muted);
  transition: all 0.15s;
}
.granularity-btn.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

/* ===== Week Chart ===== */
.week-chart { margin-bottom: 20px; }
.week-chart h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
.week-chart-bars { display: flex; gap: 8px; align-items: flex-end; height: 160px; padding-top: 4px; }
.week-chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; }
.week-chart-col .stack-wrap {
  flex: 1; width: 100%; display: flex; flex-direction: column-reverse;
  position: relative; max-width: 40px;
}
.week-chart-col .stack-seg { width: 100%; border-radius: 2px; transition: height 0.3s ease; }
.week-chart-col .stack-label { font-size: 10px; color: var(--text-muted); margin-top: 4px; font-weight: 500; }
.week-chart-col .stack-dur { font-size: 9px; color: var(--text-muted); }
.week-chart-legend { display: flex; gap: 12px; margin-top: 10px; font-size: 11px; color: var(--text-muted); flex-wrap: wrap; }
.week-chart-legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 3px; }

/* ===== Data Cards ===== */
.data-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
.data-card {
  background: var(--surface); border-radius: var(--radius-sm);
  padding: 14px; box-shadow: var(--shadow); text-align: center;
}
.data-card .card-label { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; }
.data-card .card-val { font-size: 20px; font-weight: 700; }
.data-card .card-delta { font-size: 11px; margin-top: 2px; font-weight: 600; }
.data-card .card-delta.up { color: var(--chores); }
.data-card .card-delta.down { color: var(--entertainment); }

/* ===== Category Summary Table ===== */
.cat-summary { margin-top: 16px; }
.cat-summary h3 { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
.cat-summary-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.cat-summary-table th {
  text-align: left; padding: 6px 8px; color: var(--text-muted);
  font-weight: 500; border-bottom: 1px solid var(--border); font-size: 11px;
}
.cat-summary-table td { padding: 8px; border-bottom: 1px solid #f3f4f6; }
.cat-summary-table .cat-icon-cell { width: 32px; text-align: center; }
.cat-summary-table .cat-name-cell { font-weight: 600; }
.cat-summary-table .cat-dur-cell { text-align: right; font-variant-numeric: tabular-nums; }

@media (max-width: 400px) {
  .date-center .date-full { font-size: 15px; }
  .week-chart-bars { height: 130px; }
  .data-card { padding: 10px; }
  .data-card .card-val { font-size: 17px; }
}
</style>
</head>
<body>
<div class="container" id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
// ========== CATEGORIES ==========
const PLAN_CATEGORIES = {
  work:          { name:'工作/学习', icon:'💼', color:'#4A90D9', bg:'#EDF4FC' },
  chores:        { name:'家务',      icon:'🏠', color:'#4CAF84', bg:'#EDF8F1' },
  exercise:      { name:'锻炼',      icon:'🏃', color:'#F09B4A', bg:'#FEF6EE' },
  recharge:      { name:'充电',      icon:'🔋', color:'#8B7EC8', bg:'#F4F2FA' },
  entertainment: { name:'消遣',      icon:'📱', color:'#E0687A', bg:'#FDF0F3' },
};
const RECORD_CATEGORIES = { ...PLAN_CATEGORIES, unrecorded:{ name:'未记录', icon:'❓', color:'#9CA3AF', bg:'#F3F4F6' } };
const ENTERTAINMENT_ALERT_MIN = 20;
const PLAN_DURATION_MIN = 60;
const STORAGE_KEY = 'timeperception_v2_data';
const STATE_KEY = 'timeperception_v2_state';
const SYNC_URL_KEY = 'timeperception_sync_url';
const SYNC_DEBOUNCE_MS = 3000;

// ========== HELPERS ==========
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function fmtTime(iso) { return new Date(iso).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}); }
function fmtDuration(min) {
  if(min<=0) return '0分钟';
  if(min<60) return `${min}分钟`;
  const h=Math.floor(min/60), m=min%60;
  return m>0?`${h}小时${m}分`:`${h}小时`;
}
function sessionDuration(s) {
  if(!s.end) return 0;
  return Math.round((new Date(s.end)-new Date(s.start))/60000);
}
function isToday(iso) { return new Date(iso).toDateString()===new Date().toDateString(); }
function todayStr() {
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function debounce(fn, ms) { let t; return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args),ms); }; }

// ========== DATE UTILITIES ==========
function fmtDateShort(iso) {
  const d = new Date(iso);
  return `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDateFull(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDateDisplay(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function getWeekday(dateStr) {
  const weekdays = ['日','一','二','三','四','五','六'];
  const d = new Date(dateStr + 'T00:00:00');
  return weekdays[d.getDay()];
}
function isSameDate(dateStr1, dateStr2) {
  return dateStr1 === dateStr2;
}
function getSessionsForDate(dateStr) {
  return data.sessions.filter(s => {
    const sd = new Date(s.start);
    return `${sd.getFullYear()}-${String(sd.getMonth()+1).padStart(2,'0')}-${String(sd.getDate()).padStart(2,'0')}` === dateStr;
  }).sort((a,b) => new Date(a.start) - new Date(b.start));
}
function getWeekRange(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  const monday = new Date(d);
  monday.setDate(d.getDate() + diff);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  const fmt = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  const startDate = new Date(dateStr + 'T00:00:00');
  const weekNum = getISOWeekNumber(startDate);
  return { start: fmt(monday), end: fmt(sunday), weekNum };
}
function getMonthRange(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const first = new Date(d.getFullYear(), d.getMonth(), 1);
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  const fmt = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  return { start: fmt(first), end: fmt(last) };
}
function getPrevWeek(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() - 7);
  return getWeekRange(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
}
function getPrevMonth(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setMonth(d.getMonth() - 1);
  return getMonthRange(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(Math.min(d.getDate(), 28)).padStart(2,'0')}`);
}
function getNextWeek(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + 7);
  return getWeekRange(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
}
function getNextMonth(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setMonth(d.getMonth() + 1);
  return getMonthRange(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(Math.min(d.getDate(), 28)).padStart(2,'0')}`);
}
function getISOWeekNumber(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  date.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay() || 7));
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
}
function computeDayTotal(dateStr) {
  const sessions = getSessionsForDate(dateStr);
  let total = 0;
  for (const s of sessions) {
    if (s.type !== 'record') continue;
    const dur = s.end ? sessionDuration(s) : 0;
    total += dur;
  }
  return total;
}
function computeEntertainmentPct(dateStr) {
  const sessions = getSessionsForDate(dateStr);
  let total = 0, ent = 0;
  for (const s of sessions) {
    if (s.type !== 'record') continue;
    const dur = s.end ? sessionDuration(s) : 0;
    total += dur;
    if (s.category === 'entertainment') ent += dur;
  }
  if (total === 0) return 0;
  return Math.round(ent / total * 100);
}
function getTreeIcon(dateStr) {
  const total = computeDayTotal(dateStr);
  if (total === 0) return 'tree-stump.svg';
  const entPct = computeEntertainmentPct(dateStr);
  if (entPct > 40) return 'tree-wilting.svg';
  if (entPct >= 20) return 'tree-yellowing.svg';
  return 'tree-blooming.svg';
}
function shiftDate(dateStr, days) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function goPrevPeriod() {
  if (currentTab === 'stats' && statsGranularity === 'week') {
    const prev = getPrevWeek(selectedDate);
    selectedDate = prev.start;
  } else if (currentTab === 'stats' && statsGranularity === 'month') {
    const d = new Date(selectedDate + 'T00:00:00');
    d.setMonth(d.getMonth() - 1);
    const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    const day = Math.min(parseInt(selectedDate.split('-')[2]), lastDay);
    selectedDate = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  } else {
    selectedDate = shiftDate(selectedDate, -1);
  }
  renderAll();
}
function goNextPeriod() {
  if (currentTab === 'stats' && statsGranularity === 'week') {
    const next = getNextWeek(selectedDate);
    selectedDate = next.start;
  } else if (currentTab === 'stats' && statsGranularity === 'month') {
    const d = new Date(selectedDate + 'T00:00:00');
    d.setMonth(d.getMonth() + 1);
    const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    const day = Math.min(parseInt(selectedDate.split('-')[2]), lastDay);
    selectedDate = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  } else {
    selectedDate = shiftDate(selectedDate, 1);
  }
  renderAll();
}
function renderCalendar() {
  const y = calMonth.getFullYear();
  const m = calMonth.getMonth();
  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const daysInPrevMonth = new Date(y, m, 0).getDate();
  let h = `<div class="calendar-overlay" onclick="if(event.target===this){showCalendar=false;renderAll()}">
    <div class="calendar-popup" onclick="event.stopPropagation()">
      <div class="cal-header">
        <button onclick="calMonth=new Date(${y},${m-1},1);renderAll()">←</button>
        <span class="cal-month-label">${y}年${m+1}月</span>
        <button onclick="calMonth=new Date(${y},${m+1},1);renderAll()">→</button>
      </div>
      <div class="cal-grid">
        <div class="cal-day-hdr">日</div><div class="cal-day-hdr">一</div><div class="cal-day-hdr">二</div><div class="cal-day-hdr">三</div><div class="cal-day-hdr">四</div><div class="cal-day-hdr">五</div><div class="cal-day-hdr">六</div>`;
  for (let i = firstDay - 1; i >= 0; i--) {
    const d = daysInPrevMonth - i;
    h += `<div class="cal-day other-month">${d}</div>`;
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = isSameDate(dateStr, todayStr());
    const isSelected = isSameDate(dateStr, selectedDate);
    const cls = ['cal-day', isToday ? 'today' : '', isSelected ? 'selected' : ''].filter(Boolean).join(' ');
    h += `<div class="${cls}" onclick="selectedDate='${dateStr}';showCalendar=false;renderAll()">${d}</div>`;
  }
  const remaining = 7 - ((firstDay + daysInMonth) % 7);
  if (remaining < 7) {
    for (let d = 1; d <= remaining; d++) {
      h += `<div class="cal-day other-month">${d}</div>`;
    }
  }
  h += `</div></div></div>`;
  return h;
}

// ========== LOCAL STORAGE ==========
function loadLocal() {
  try { const d=JSON.parse(localStorage.getItem(STORAGE_KEY)); return d&&d.sessions?d:{sessions:[]}; }
  catch { return {sessions:[]}; }
}
function saveLocal(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }
function loadState() { try{return JSON.parse(localStorage.getItem(STATE_KEY));}catch{return null;} }
function saveState(s) { if(s) localStorage.setItem(STATE_KEY,JSON.stringify(s)); else localStorage.removeItem(STATE_KEY); }

// ========== SYNC ==========
function getSyncUrl() { return localStorage.getItem(SYNC_URL_KEY)||''; }
function setSyncUrl(url) { localStorage.setItem(SYNC_URL_KEY, url); }

async function pullFromCloud() {
  const url = getSyncUrl();
  if (!url) return null;
  try {
    const resp = await fetch(url, { method: 'GET', signal: AbortSignal.timeout(5000) });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const cloudData = await resp.json();
    if (cloudData && Array.isArray(cloudData.sessions)) return cloudData;
    return null;
  } catch(e) {
    console.warn('Pull failed:', e.message);
    return null;
  }
}

async function pushToCloud(data) {
  const url = getSyncUrl();
  if (!url) return;
  try {
    const resp = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(data),
      signal: AbortSignal.timeout(5000),
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    return true;
  } catch(e) {
    console.warn('Push failed:', e.message);
    return false;
  }
}

const debouncedPush = debounce(async (data) => {
  updateSyncStatus('syncing');
  const ok = await pushToCloud(data);
  updateSyncStatus(ok ? 'synced' : 'error');
}, SYNC_DEBOUNCE_MS);

function updateSyncStatus(status) {
  const el = document.getElementById('sync-dot');
  if (!el) return;
  const parent = el.parentElement;
  parent.className = 'sync-indicator ' + status;
  const labels = { synced: '已同步', syncing: '同步中…', error: '同步失败', offline: '未设置同步' };
  parent.lastChild.textContent = labels[status] || '';
}

// ========== DATA MANAGEMENT ==========
let data = { sessions: [] };
let state = loadState();
let activePlan = state?.plan || null;
let activeRecord = state?.record || null;
let sessionTimers = {};
let recordStartTime = null;
let alertTriggered = {};
let currentTab = 'timeline';
let currentMode = 'plan';
let editingSession = null;
let showEditModal = false;
let syncStatus = 'offline';
let initialSyncDone = false;
let selectedDate = todayStr();
let statsGranularity = 'day';
let showCalendar = false;
let calMonth = new Date();

function saveDataAndSync() {
  saveLocal(data);
  persistState();
  debouncedPush(data);
}

function persistState() {
  saveState({ plan: activePlan, record: activeRecord });
}

// ========== PLAN LOGIC ==========
function startPlan(category) {
  const now = new Date().toISOString();
  const endTime = new Date(Date.now() + PLAN_DURATION_MIN * 60000).toISOString();
  if (activePlan) {
    const prev = data.sessions.find(s => s.id === activePlan.id);
    if (prev && new Date(prev.end) > new Date(now)) prev.end = now;
  }
  const session = { id: uid(), type: 'plan', category, start: now, end: endTime };
  data.sessions.push(session);
  activePlan = session;
  saveDataAndSync();
  renderAll();
}

function stopPlan() {
  if (!activePlan) return;
  const session = data.sessions.find(s => s.id === activePlan.id);
  if (session) { session.end = new Date().toISOString(); }
  activePlan = null;
  saveDataAndSync();
  renderAll();
}

let planAlertedIds = new Set();
function cleanupExpiredPlans() {
  if (activePlan && new Date(activePlan.end) <= new Date()) {
    if (!planAlertedIds.has(activePlan.id)) {
      planAlertedIds.add(activePlan.id);
      playPlanChime();
      try { navigator.vibrate?.([200, 100, 200]); } catch(e) {}
    }
    activePlan = null;
    persistState();
  }
}

// ========== RECORD LOGIC ==========
function startRecord(category) {
  const now = new Date().toISOString();
  if (activeRecord) endRecord(now);
  const session = { id: uid(), type: 'record', category, start: now, end: null };
  data.sessions.push(session);
  activeRecord = session;
  recordStartTime = Date.now();
  persistState();
  saveLocal(data);
  debouncedPush(data);
  startRecordTimer(session);
  renderAll();
}

function endRecord(endTime) {
  if (!activeRecord) return;
  const session = data.sessions.find(s => s.id === activeRecord.id);
  if (session) session.end = endTime || new Date().toISOString();
  stopRecordTimer(activeRecord.id);
  activeRecord = null;
  recordStartTime = null;
  saveDataAndSync();
}

function startRecordTimer(session) {
  stopRecordTimer(session.id);
  sessionTimers[session.id] = setInterval(() => {
    updateRecordDisplay();
    checkEntertainmentAlert(session);
  }, 1000);
}
function stopRecordTimer(id) {
  if (sessionTimers[id]) { clearInterval(sessionTimers[id]); delete sessionTimers[id]; }
}

function checkEntertainmentAlert(session) {
  if (session.category !== 'entertainment' || !session.start) return;
  const elapsed = Math.floor((Date.now() - new Date(session.start).getTime()) / 60000);
  if (elapsed >= ENTERTAINMENT_ALERT_MIN && !alertTriggered[session.id]) {
    alertTriggered[session.id] = true;
    triggerAlert();
  }
}

let lastAlertTime = 0;
function triggerAlert() {
  const now = Date.now();
  if (now - lastAlertTime < 60000) return;
  lastAlertTime = now;
  playChime();
  try { navigator.vibrate?.([300, 150, 300]); } catch(e) {}
  setTimeout(updateAlertUI, 50);
}
function playChime() {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [659.25,783.99].forEach((freq,i)=>{
      const osc=ctx.createOscillator(); osc.type='sine'; osc.frequency.value=freq;
      const g=ctx.createGain(); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.25,ctx.currentTime+i*0.25);
      g.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+i*0.25+0.5);
      osc.connect(g); osc.start(ctx.currentTime+i*0.25); osc.stop(ctx.currentTime+i*0.25+0.5);
    });
  }catch(e){}
}
function playPlanChime() {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    // Gentle C-E-G major triad arpeggio (warm "task complete" feel)
    [523.25, 659.25, 783.99].forEach((freq, i) => {
      const t = ctx.currentTime + i * 0.3;
      const osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.value = freq;
      const g = ctx.createGain(); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.2, t);
      g.gain.exponentialRampToValueAtTime(0.01, t + 0.6);
      osc.connect(g); osc.start(t); osc.stop(t + 0.6);
    });
  } catch(e) {}
}
function updateAlertUI() {
  document.querySelectorAll('.cat-btn.entertainment').forEach(b=>b.classList.add('alerting'));
}
function removeAlertUI() {
  document.querySelectorAll('.cat-btn.entertainment').forEach(b=>b.classList.remove('alerting'));

function updateRecordDisplay() {

  if(el) el.textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

function editSessionById(id) {

function updateSession(id, updates) {

  showEditModal = false;

function deleteSession(id) {

  if(activePlan&&activePlan.id===id){activePlan=null;persistState();}
  data.sessions=data.sessions.filter(s=>s.id!==id);
  saveDataAndSync();
  renderAll();
}

// ========== QUERIES ==========
function getTodaySessions(dateStr) {
  const target = dateStr || todayStr();
  return getSessionsForDate(target);
}
function getTodayStats(dateStr) {
  const sessions=getTodaySessions(dateStr);
  const planStats={}, recordStats={};
  for(const k of Object.keys(PLAN_CATEGORIES)){planStats[k]=0;}
  for(const k of Object.keys(RECORD_CATEGORIES)){recordStats[k]=0;}
  let planTotal=0, recordTotal=0;
  const target = dateStr || todayStr();
  for(const s of sessions){
    const dur=s.end?sessionDuration(s):(activeRecord&&s.id===activeRecord.id?Math.floor((Date.now()-new Date(s.start).getTime())/60000):0);
    if(s.type==='plan'){planStats[s.category]+=dur;planTotal+=dur;}
    else{recordStats[s.category]+=dur;recordTotal+=dur;}
  }
  return {planStats,recordStats,planTotal,recordTotal};
}
function getActivePlanRemaining() {
  if(!activePlan) return 0;
  return Math.max(0,Math.floor((new Date(activePlan.end)-Date.now())/60000));
}

// ========== TIMELINE BLOCK CONSTRUCTION (flat list, no pairing) ==========
function buildTimelineBlocks() {
  const sessions = getTodaySessions(selectedDate);
  const blocks = sessions.map(s => ({
    type: s.type, // 'plan' or 'record'
    session: s,
    start: new Date(s.start),
    end: s.end ? new Date(s.end) : null, // null = active
    truncated: false,
  }));
  blocks.sort((a, b) => a.start - b.start);

  // Truncate overlapping blocks: if block A ends after block B starts, truncate A to B
  for (let i = 0; i < blocks.length; i++) {
    const a = blocks[i];
    if (a.type === 'plan' && a.end) {
      for (let j = i + 1; j < blocks.length; j++) {
        const b = blocks[j];
        if (a.end > b.start) {
          a.end = new Date(b.start);
          a.truncated = true;
          break;
        }
      }
    }
  }

  return blocks;
}

// ========== TIMELINE RENDER ==========
function renderTimelineBlock(block, nowTime) {
  const s = block.session;
  const cats = block.type === 'plan' ? PLAN_CATEGORIES : RECORD_CATEGORIES;
  const cat = cats[s.category];
  const isActive = block.type === 'record' && !s.end;
  const durMin = isActive
    ? Math.max(1, (nowTime - block.start) / 60000)
    : Math.max(1, (block.end - block.start) / 60000);
  const h = Math.max(40, Math.ceil(durMin * 1.8));

  if (block.type === 'plan') {
    const dur = Math.round((block.end - block.start) / 60000);
    const durStr = block.truncated ? `${fmtDuration(dur)} · 已中断` : fmtDuration(dur);
    return `<div class="tl-v2-track plan-only ${s.category}${block.truncated?' truncated':''}">
      <div class="tl-v2-plan" style="min-height:${h}px">
        <span>${cat.icon}</span><span>${cat.name}</span>
        <span class="tl-v2-time">${fmtTime(s.start)} – ${fmtTime(block.end)}</span>
        <span class="tl-v2-dur">${durStr}</span>
        <span class="tl-v2-noedit">不可编辑</span>
      </div>
    </div>`;
  }

  // Record block
  const endStr = isActive ? '进行中' : fmtTime(s.end);
  const durStr = isActive ? '计时中…' : fmtDuration(Math.round(durMin));
  const cls = 'tl-v2-track record-only ' + s.category + (isActive ? ' ongoing' : '');
  return `<div class="${cls}">
    <div class="tl-v2-actual" style="min-height:${h}px">
      <span>${cat.icon} ${cat.name}</span>
      <span class="tl-v2-time">${fmtTime(s.start)} – ${endStr}</span>
      <span class="tl-v2-dur">${durStr}</span>
      <div class="tl-v2-actions">
        <button class="tl-action-btn" onclick="event.stopPropagation();editSessionById('${s.id}')">✏️</button>
        <button class="tl-action-btn danger" onclick="event.stopPropagation();if(confirm('删除这条记录？'))deleteSession('${s.id}')">🗑</button>
      </div>
    </div>
  </div>`;
}

function renderNowLine() {
  return `<div class="tl-v2-now"><div class="tl-v2-now-line"><span class="tl-v2-now-label">NOW</span></div></div>`;
}

function renderGap(minutes) {
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  const text = h > 0 ? `闲置 · ${h}小时${m > 0 ? m + '分' : ''}` : `闲置 · ${m}分`;
  return `<div class="tl-v2-gap"><span class="tl-v2-gap-dot"></span>${text}</div>`;
}

      <strong>计划</strong>：固定 1 小时，不可编辑，用来事先规划。<br>
      <strong>记录</strong>：灵活计时，可事后编辑，追踪实际时间去向。<br>
      <strong>消遣提醒</strong>：记录模式下消遣超 20 分钟变色 + 铃声。<br>
      <strong>未记录</strong>：编辑时可选的分类，标记无明确归类的时段。<br>
      数据默认存浏览器本地，设置同步后自动存取 Google Sheets。
    </p>
  </div>`;
  html+=`</div>`;

  app.innerHTML=html;
}

// ========== STATS RENDER HELPERS ==========
function computeStatsForDate(dateStr) {
  const sessions = getSessionsForDate(dateStr);
  const planStats = {}, recordStats = {};
  for (const k of Object.keys(PLAN_CATEGORIES)) { planStats[k] = 0; }
  for (const k of Object.keys(RECORD_CATEGORIES)) { recordStats[k] = 0; }
  let planTotal = 0, recordTotal = 0;
  for (const s of sessions) {
    const dur = s.end ? sessionDuration(s) : 0;
    if (s.type === 'plan') { planStats[s.category] += dur; planTotal += dur; }
    else { recordStats[s.category] += dur; recordTotal += dur; }
  }
  return { planStats, recordStats, planTotal, recordTotal };
}

function renderDayStats() {
  const { planStats, recordStats, planTotal, recordTotal } = computeStatsForDate(selectedDate);
  const displayRecordStats = { ...recordStats };
  if (isSameDate(selectedDate, todayStr()) && activeRecord) {
    const elapsed = Math.floor((Date.now() - new Date(activeRecord.start).getTime()) / 60000);
    displayRecordStats[activeRecord.category] = (displayRecordStats[activeRecord.category] || 0) + elapsed;
  }
  const totalActual = Object.values(displayRecordStats).reduce((a, b) => a + b, 0);
  const hasAnyData = totalActual > 0 || planTotal > 0;
  if (!hasAnyData) {
    return `<div class="stats-v2-empty"><div class="icon">📊</div><div>${isSameDate(selectedDate, todayStr()) ? '今天' : fmtDateFull(selectedDate)}还没有数据</div><div class="sub">计划或记录一条来开始</div></div>`;
  }
  let h = '';
  const now = new Date();
  const dateStr = fmtDateFull(selectedDate);
  const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  h += `<h2 style="font-size:18px;margin-bottom:4px">📊 日统计</h2>`;
  h += `<div class="stats-v2-subtitle">${dateStr} 周${getWeekday(selectedDate)} · 截止 ${timeStr}</div>`;

  const totalActualH = totalActual > 0 ? (totalActual / 60).toFixed(1) : '0';
  const planHDisplay = planTotal > 0 ? (planTotal / 60).toFixed(1) + 'h' : '—';
  const actualHDisplay = totalActual > 0 ? (totalActual / 60).toFixed(1) + 'h' : '—';
  const coverage = planTotal > 0 && totalActual > 0 ? Math.min(100, Math.round(planTotal / totalActual * 100)) : 0;
  const entPlan = planStats['entertainment'] || 0;
  const entActual = displayRecordStats['entertainment'] || 0;
  const unplannedEnt = Math.max(0, entActual - entPlan);
  const unplannedH = unplannedEnt > 0 ? (unplannedEnt / 60).toFixed(1) + 'h' : '—';

  h += `<div class="stats-v2-summary">`;
  if (totalActual > 0) {
    const CIRCUMFERENCE = 2 * Math.PI * 50;
    let donutSegments = '', cumulative = 0;
    for (const [key, cat] of Object.entries(RECORD_CATEGORIES)) {
      const dur = displayRecordStats[key] || 0;
      if (dur <= 0) continue;
      const pct = dur / totalActual;
      const dashLen = pct * CIRCUMFERENCE;
      donutSegments += `<circle cx="60" cy="60" r="50" fill="none" stroke="${cat.color}" stroke-width="16" stroke-dasharray="${dashLen.toFixed(2)} ${CIRCUMFERENCE.toFixed(2)}" stroke-dashoffset="${cumulative.toFixed(2)}"/>`;
      cumulative += dashLen;
    }
    h += `<div class="stats-v2-donut"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="#f3f4f6" stroke-width="16"/>${donutSegments}</svg><div class="stats-v2-donut-center"><div class="big">${totalActualH}h</div><div class="label">总记录</div></div></div>`;
  } else {
    h += `<div class="stats-v2-donut"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="#f3f4f6" stroke-width="16"/></svg><div class="stats-v2-donut-center"><div class="big">${totalActualH}h</div><div class="label">总记录</div></div></div>`;
  }
  h += `<div class="stats-v2-summary-side">
    <div class="stats-v2-summary-row"><span>📋 计划时长</span><span class="val">${planHDisplay}</span></div>
    <div class="stats-v2-summary-row"><span>⏱ 实际记录</span><span class="val">${actualHDisplay}</span></div>
    <div class="stats-v2-summary-row"><span>📱 计划外消遣</span><span class="val" style="color:var(--entertainment)">${unplannedH}</span></div>
    <div class="stats-v2-divider"></div>
    <div class="stats-v2-completion ${coverage >= 80 ? 'good' : 'warn'}"><span class="arrow">→</span> 计划覆盖率 ${coverage}%</div>
  </div></div>`;

  h += `<div class="stats-v2-section-title">分类明细 · 计划 vs 实际</div>`;
  for (const [key, cat] of Object.entries(PLAN_CATEGORIES)) {
    const planDur = planStats[key] || 0, actualDur = displayRecordStats[key] || 0;
    const planH = planDur > 0 ? (planDur / 60).toFixed(1) + 'h' : '0h';
    const actH = actualDur > 0 ? (actualDur / 60).toFixed(1) + 'h' : '0h';
    const rowPct = planDur > 0 ? Math.round(actualDur / planDur * 100) : 0;
    let pctDisplay, pctColor, barW;
    if (planDur > 0) {
      pctDisplay = `${rowPct}%`;
      barW = Math.min(100, rowPct);
      pctColor = rowPct >= 90 ? 'var(--chores)' : rowPct >= 50 ? 'var(--exercise)' : 'var(--entertainment)';
    } else {
      pctDisplay = '—';
      barW = actualDur > 0 ? 100 : 0;
      pctColor = 'var(--text-muted)';
    }
    h += `<div class="stats-v2-cat-row"><div class="icon">${cat.icon}</div><div class="info"><div class="name">${cat.name}</div><div class="time-row"><span>计划 ${planH}</span><span>实际 ${actH}</span></div></div><div class="bar-wrap"><div class="bar-track"><div class="bar-fill" style="width:${barW}%;background:${cat.color}"></div></div><div class="bar-pct" style="color:${pctColor}">${pctDisplay}</div></div></div>`;
  }
  if (unplannedEnt > 0) {
    h += `<div class="stats-v2-unplanned"><span class="icon">⚠️</span><span>${(unplannedEnt / 60).toFixed(1)} 小时消遣没有对应计划 — 属于计划外时间</span></div>`;
  }
  h += `<div class="stats-v2-legend">`;
  for (const [key, cat] of Object.entries(PLAN_CATEGORIES)) {
    h += `<span><span class="dot" style="background:${cat.color}"></span>${cat.name}</span>`;
  }
  h += `</div>`;
  return h;
}

function renderWeekStats() {

  for (const k of Object.keys(PLAN_CATEGORIES)) catTotals[k] = 0;
  for (let i = 0; i < 7; i++) {
    const d = shiftDate(week.start, i);
    const stats = computeStatsForDate(d);
    const dur = stats.recordTotal;
    days.push({ date: d, ...stats, recordTotal: dur });
    weekTotal += dur;
    weekPlanTotal += stats.planTotal;
    if (dur > maxDayDur) maxDayDur = dur;
    for (const k of Object.keys(PLAN_CATEGORIES)) {
      catTotals[k] += (stats.recordStats[k] || 0);

  }

  // Prev week for deltas
  let prevWeekTotal = 0, prevEntTotal = 0;
  for (let i = 0; i < 7; i++) {

  // Data cards
  const avgPerDay = weekTotal > 0 ? Math.round(weekTotal / 7) : 0;
  const coverage = weekPlanTotal > 0 && weekTotal > 0 ? Math.min(100, Math.round(weekPlanTotal / weekTotal * 100)) : 0;
  const entPct = weekTotal > 0 ? Math.round(curEntTotal / weekTotal * 100) : 0;

function renderMonthStats() {
  const month = getMonthRange(selectedDate);
  const prevMonth = getPrevMonth(selectedDate);
  const d = new Date(selectedDate + 'T00:00:00');
  const monthLabel = `${d.getFullYear()}年${d.getMonth() + 1}月`;

  // Split into weeks
  const weeks = [];
  const monStart = new Date(month.start + 'T00:00:00');
  let curWeekStart = new Date(monStart);
  const diff = curWeekStart.getDay() === 0 ? -6 : 1 - curWeekStart.getDay();
  curWeekStart.setDate(curWeekStart.getDate() + diff);
  const monEnd = new Date(month.end + 'T00:00:00');

  while (curWeekStart <= monEnd) {
    const wkStart = new Date(curWeekStart);
    const wkEnd = new Date(curWeekStart);
    wkEnd.setDate(wkEnd.getDate() + 6);
    const ws = `${wkStart.getFullYear()}-${String(wkStart.getMonth() + 1).padStart(2, '0')}-${String(wkStart.getDate()).padStart(2, '0')}`;
    const we = `${wkEnd.getFullYear()}-${String(wkEnd.getMonth() + 1).padStart(2, '0')}-${String(wkEnd.getDate()).padStart(2, '0')}`;
    let wkTotal = 0, wkPlanTotal = 0;

      const day = shiftDate(ws, i);
      const stats = computeStatsForDate(day);
      wkTotal += stats.recordTotal;
      wkPlanTotal += stats.planTotal;
      for (const k of Object.keys(PLAN_CATEGORIES)) {

    const weekNum = getISOWeekNumber(wkStart);
    weeks.push({ label: `W${weekNum}`, total: wkTotal, planTotal: wkPlanTotal, catTotals: wkCatTotals });

    for (const k of Object.keys(PLAN_CATEGORIES)) {
      monthCatTotals[k] += (wk.catTotals[k] || 0);
    }
  }

  // Prev month for deltas
  let prevMonthTotal = 0, prevMonthEnt = 0;
  for (let i = 0; i < 31; i++) {
    const day = shiftDate(prevMonth.start, i);
    if (day > prevMonth.end) break;
    const stats = computeStatsForDate(day);
    prevMonthTotal += stats.recordTotal;
    prevMonthEnt += (stats.recordStats['entertainment'] || 0);

  const curMonthEnt = monthCatTotals['entertainment'] || 0;

  let h = '';

  // Stacked bar chart
  const catOrder = ['work', 'chores', 'exercise', 'recharge', 'entertainment'];
  const catColors = { work: '#4A90D9', chores: '#4CAF84', exercise: '#F09B4A', recharge: '#8B7EC8', entertainment: '#E0687A' };
  const MAX_BAR_H = 140;
  h += `<div class="week-chart"><h3>每周分类分布</h3><div class="week-chart-bars">`;
  for (const wk of weeks) {
    const scale = maxWkDur > 0 ? MAX_BAR_H / maxWkDur : 0;
    h += `<div class="week-chart-col"><div class="stack-wrap">`;
    for (const catKey of catOrder) {
      const dur = wk.catTotals[catKey] || 0;
      if (dur <= 0) continue;
      const segH = Math.max(2, Math.round(dur * scale));
      h += `<div class="stack-seg" style="height:${segH}px;background:${catColors[catKey]}"></div>`;
    }
    h += `</div><div class="stack-label">${wk.label}</div><div class="stack-dur">${wk.total > 0 ? fmtDuration(wk.total) : ''}</div></div>`;
  }
  h += `</div><div class="week-chart-legend">`;

    h += `<span><span class="dot" style="background:${catColors[catKey]}"></span>${cat.name}</span>`;
  }
  h += `</div></div>`;

  // Data cards
  const daysInMonth = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  const avgPerDay = monthTotal > 0 ? Math.round(monthTotal / daysInMonth) : 0;
  const coverage = monthPlanTotal > 0 && monthTotal > 0 ? Math.min(100, Math.round(monthPlanTotal / monthTotal * 100)) : 0;
  const entPct = monthTotal > 0 ? Math.round(curMonthEnt / monthTotal * 100) : 0;
  const deltaTotal = prevMonthTotal > 0 ? Math.round((monthTotal - prevMonthTotal) / prevMonthTotal * 100) : 0;
  const deltaEnt = prevMonthEnt > 0 ? Math.round((curMonthEnt - prevMonthEnt) / prevMonthEnt * 100) : 0;
  h += `<div class="data-cards">
    <div class="data-card"><div class="card-label">月总记录</div><div class="card-val">${fmtDuration(monthTotal)}</div>${deltaTotal !== 0 ? `<div class="card-delta ${deltaTotal >= 0 ? 'up' : 'down'}">${deltaTotal >= 0 ? '↑' : '↓'}${Math.abs(deltaTotal)}%</div>` : ''}</div>
    <div class="data-card"><div class="card-label">日均</div><div class="card-val">${fmtDuration(avgPerDay)}</div></div>
    <div class="data-card"><div class="card-label">计划覆盖率</div><div class="card-val">${coverage}%</div></div>
    <div class="data-card"><div class="card-label">消遣占比</div><div class="card-val">${entPct}%</div>${deltaEnt !== 0 ? `<div class="card-delta ${deltaEnt <= 0 ? 'up' : 'down'}">${deltaEnt <= 0 ? '↓' : '↑'}${Math.abs(deltaEnt)}%</div>` : ''}</div>
  </div>`;

  // Category summary table
  h += `<div class="cat-summary"><h3>分类汇总</h3><table class="cat-summary-table"><thead><tr><th></th><th>分类</th><th>月总时长</th><th>日均</th><th>备注</th></tr></thead><tbody>`;
  for (const catKey of catOrder) {
    const cat = PLAN_CATEGORIES[catKey];
    const totalMin = monthCatTotals[catKey] || 0;
    const dailyAvg = Math.round(totalMin / daysInMonth);
    let note = '';
    if (catKey === 'entertainment' && entPct > 40) note = '⚠️ 偏高';
    if (catKey === 'exercise' && dailyAvg < 15) note = '建议多动';
    if (catKey === 'recharge' && dailyAvg < 10) note = '注意休息';
    h += `<tr><td class="cat-icon-cell">${cat.icon}</td><td class="cat-name-cell">${cat.name}</td><td class="cat-dur-cell">${fmtDuration(totalMin)}</td><td class="cat-dur-cell">${fmtDuration(dailyAvg)}</td><td style="font-size:11px;color:var(--text-muted)">${note}</td></tr>`;
  }
  h += `</tbody></table></div>`;
  return h;

}

async function syncNow() {
  updateSyncStatus('syncing');
  const ok = await pushToCloud(data);
  updateSyncStatus(ok ? 'synced' : 'error');
  showToast(ok ? '同步成功' : '同步失败，请检查网络');
}

function restoreActiveFromData() {
  const now = new Date();

  // Clear stale active record: if the session no longer exists or has ended
  if (activeRecord) {
    const session = data.sessions.find(s => s.id === activeRecord.id);
    if (!session || session.end) {
      stopRecordTimer(activeRecord.id);
      activeRecord = null;
      recordStartTime = null;
    }
  }

  // Clear stale active plan
  if (activePlan) {
    const session = data.sessions.find(s => s.id === activePlan.id);
    if (!session || new Date(session.end) <= now) {
      activePlan = null;
    }
  }

  // Detect active record: today's record session with no end time
  if (!activeRecord) {
    const running = data.sessions.find(s => s.type === 'record' && !s.end && isToday(s.start));
    if (running) {
      activeRecord = running;
      recordStartTime = new Date(running.start).getTime();
      startRecordTimer(running);
    }
  }

  // Detect active plan: today's plan session whose end is still in the future
  if (!activePlan) {
    const plans = data.sessions.filter(s => s.type === 'plan' && isToday(s.start) && new Date(s.end) > now);
    if (plans.length > 0) {
      activePlan = plans.reduce((a, b) => new Date(a.start) > new Date(b.start) ? a : b);
    }
  }

  persistState();
}

async function pullAndMerge() {
  const cloudData = await pullFromCloud();
  if (!cloudData) { updateSyncStatus('error'); return; }
  // Merge: cloud sessions + local sessions that aren't in cloud
  const cloudIds = new Set(cloudData.sessions.map(s=>s.id));
  const localOnly = data.sessions.filter(s=>!cloudIds.has(s.id));
  data.sessions = [...cloudData.sessions, ...localOnly];
  saveLocal(data);
  restoreActiveFromData();
  updateSyncStatus('synced');
  renderAll();
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    b.classList.toggle('active',(i===0&&tab==='timeline')||(i===1&&tab==='stats')||(i===2&&tab==='settings'));
  });
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  const panel=document.getElementById(`panel-${tab}`);
  if(panel) panel.classList.add('active');
}

    <div class="modal-sheet"><h3>编辑记录</h3>
      <div class="form-group"><label>分类</label><select id="edit-category">${Object.entries(cats).map(([k,c])=>`<option value="${k}"${k===s.category?' selected':''}>${c.icon} ${c.name}</option>`).join('')}</select></div>
      <div class="form-group"><label>开始时间</label><input type="datetime-local" id="edit-start" value="${fmt(startDate)}"></div>
      <div class="form-group"><label>结束时间</label><input type="datetime-local" id="edit-end" value="${fmt(endDate)}"></div>
      <div class="btn-group" style="justify-content:space-between">
        <button class="btn btn-secondary" onclick="deleteSession('${s.id}');showToast('已删除')">🗑 删除</button>
        <div style="display:flex;gap:8px">
          <button class="btn btn-secondary" onclick="showEditModal=false;editingSession=null;renderAll()">取消</button>
          <button class="btn btn-primary" onclick="saveEdit()">保存</button>
        </div>
      </div>
    </div>
  </div>`;
}
function saveEdit() {
  if(!editingSession) return;
  const category=document.getElementById('edit-category').value;
  const start=new Date(document.getElementById('edit-start').value).toISOString();
  const end=new Date(document.getElementById('edit-end').value).toISOString();
  if(new Date(end)<=new Date(start)){showToast('结束时间必须晚于开始时间');return;}
  updateSession(editingSession.id,{category,start,end});
  showToast('已更新');
}

// ========== EXPORT / IMPORT ==========
function exportData() {
  const json=JSON.stringify(data,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`时间知觉_${todayStr()}.json`;a.click();
  URL.revokeObjectURL(url);showToast('已导出');
}
function importData(event) {
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const imported=JSON.parse(e.target.result);
      if(!imported.sessions||!Array.isArray(imported.sessions)) throw new Error('invalid');
      if(confirm(`导入 ${imported.sessions.length} 条记录，合并到现有数据？`)){
        const existingIds=new Set(data.sessions.map(s=>s.id));
        data.sessions=[...data.sessions,...imported.sessions.filter(s=>!existingIds.has(s.id))];
        saveDataAndSync();renderAll();showToast(`导入 ${imported.sessions.filter(s=>!existingIds.has(s.id)).length} 条`);
      }
    }catch(err){showToast('文件格式不正确');}
  };
  reader.readAsText(file);event.target.value='';
}

function showToast(msg) {
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  document.getElementById('toast-root').appendChild(el);
  setTimeout(()=>el.remove(),2200);
}

// ========== INIT ==========
async function init() {
  // Load local data first (fast)
  data = loadLocal();

  // Restore state
  if(activeRecord){
    const session=data.sessions.find(s=>s.id===activeRecord.id);
    if(session&&!session.end){
      activeRecord=session;
      recordStartTime=new Date(session.start).getTime();
      startRecordTimer(session);
      const elapsed=Math.floor((Date.now()-recordStartTime)/60000);
      if(session.category==='entertainment'&&elapsed>=ENTERTAINMENT_ALERT_MIN) alertTriggered[session.id]=true;
    }else{activeRecord=null;recordStartTime=null;persistState();}
  }
  if(activePlan){
    const session=data.sessions.find(s=>s.id===activePlan.id);
    if(!session||new Date(session.end)<=new Date()){activePlan=null;persistState();}
  }

  // Data integrity
  let dirty=false;
  for(const s of data.sessions){
    if(!s.type){s.type='record';dirty=true;}
    if(!s.end&&s.type==='plan'){s.end=s.start;dirty=true;}
    if(!s.end&&s.type==='record'&&(!activeRecord||s.id!==activeRecord.id)){s.end=s.start;dirty=true;}
  }
  if(dirty) saveLocal(data);

  renderAll();

  // Try to pull from cloud in background
  if(getSyncUrl()){
    updateSyncStatus('syncing');
    const cloudData = await pullFromCloud();
    if(cloudData){
      const cloudIds=new Set(cloudData.sessions.map(s=>s.id));
      const localOnly=data.sessions.filter(s=>!cloudIds.has(s.id));
      data.sessions=[...cloudData.sessions,...localOnly];
      saveLocal(data);
      restoreActiveFromData();
      updateSyncStatus('synced');
      // Only mark sync done if we successfully pulled & merged —
      // otherwise our local data might be stale and we should NOT push it
      initialSyncDone = true;
      renderAll();
    }else{
      updateSyncStatus('error');
      // Cloud unreachable: keep initialSyncDone=false to prevent
      // pushing potentially stale local data back to cloud
    }
  } else {
    // No sync configured — local-only mode, safe to push (nowhere)
    initialSyncDone = true;
  }

  setInterval(()=>{if(activeRecord)updateRecordDisplay();cleanupExpiredPlans();},1000);
}

// Push on page close to avoid losing data between devices
// Only push after initial sync is done to avoid overwriting cloud with stale local data
window.addEventListener('beforeunload', () => {
  if (getSyncUrl() && initialSyncDone) {
    navigator.sendBeacon(getSyncUrl(), JSON.stringify(data));
  }
});

// Also attempt push when page becomes hidden (switching tabs, locking phone)
window.addEventListener('visibilitychange', () => {
  if (document.hidden && getSyncUrl() && initialSyncDone) {
    navigator.sendBeacon(getSyncUrl(), JSON.stringify(data));
  }
});

init();
</script>
