<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Ground -->
  <ellipse cx="24" cy="40" rx="20" ry="4" fill="#8b7355"/>
  <!-- Stem - drooping right -->
  <path d="M24 40 Q26 30 28 25 Q30 21 32 19" stroke="#6b4a2e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Branch drooping left -->
  <path d="M28 25 Q24 25 20 27" stroke="#6b4a2e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Leaves - brown and sparse -->
  <ellipse cx="32" cy="18" rx="4" ry="2.5" fill="#a08030" transform="rotate(40,32,18)" opacity="0.7"/>
  <ellipse cx="20" cy="26" rx="3.5" ry="2" fill="#8b6914" transform="rotate(-30,20,26)" opacity="0.5"/>
  <!-- Falling leaf -->
  <ellipse cx="36" cy="10" rx="3.5" ry="2" fill="#a08030" transform="rotate(55,36,10)" opacity="0.4"/>
</svg>
