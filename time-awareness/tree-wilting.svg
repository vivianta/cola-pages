<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Ground shadow -->
  <ellipse cx="60" cy="108" rx="35" ry="6" fill="#c4b8a8" opacity="0.5"/>
  <!-- Trunk -->
  <rect x="55" y="68" width="10" height="36" rx="3" fill="#6b4a2e"/>
  <rect x="55" y="68" width="5" height="36" rx="2" fill="#5a3a1e"/>
  <!-- Branches - more exposed, drooping -->
  <line x1="60" y1="68" x2="38" y2="56" stroke="#6b4a2e" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="60" y1="68" x2="82" y2="54" stroke="#6b4a2e" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="60" y1="72" x2="28" y2="62" stroke="#6b4a2e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="60" y1="72" x2="92" y2="60" stroke="#6b4a2e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Sparse, brown canopy -->
  <ellipse cx="34" cy="54" rx="10" ry="8" fill="#8b6914" opacity="0.6"/>
  <ellipse cx="84" cy="52" rx="10" ry="8" fill="#a07020" opacity="0.5"/>
  <ellipse cx="50" cy="44" rx="12" ry="9" fill="#7a5a14" opacity="0.5"/>
  <ellipse cx="72" cy="40" rx="10" ry="7" fill="#8b6914" opacity="0.4"/>
  <ellipse cx="60" cy="48" rx="14" ry="10" fill="#6b4a10" opacity="0.3"/>
  <ellipse cx="44" cy="32" rx="8" ry="6" fill="#9a7820" opacity="0.3"/>
  <!-- Falling dead leaves -->
  <ellipse cx="28" cy="72" rx="4" ry="2.5" fill="#8b6914" transform="rotate(40,28,72)" opacity="0.5"/>
  <ellipse cx="94" cy="78" rx="3.5" ry="2" fill="#7a5a14" transform="rotate(-30,94,78)" opacity="0.4"/>
  <ellipse cx="50" cy="88" rx="3" ry="2" fill="#8b6914" transform="rotate(50,50,88)" opacity="0.3"/>
  <ellipse cx="38" cy="62" rx="3" ry="2" fill="#a07020" transform="rotate(20,38,62)" opacity="0.4"/>
</svg>
