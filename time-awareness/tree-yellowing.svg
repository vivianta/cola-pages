<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Ground shadow -->
  <ellipse cx="60" cy="108" rx="35" ry="6" fill="#c4b8a8" opacity="0.5"/>
  <!-- Trunk -->
  <rect x="55" y="68" width="10" height="36" rx="3" fill="#6b4a2e"/>
  <rect x="55" y="68" width="5" height="36" rx="2" fill="#5a3a1e"/>
  <!-- Branches -->
  <line x1="60" y1="68" x2="40" y2="52" stroke="#6b4a2e" stroke-width="4" stroke-linecap="round"/>
  <line x1="60" y1="68" x2="80" y2="52" stroke="#6b4a2e" stroke-width="4" stroke-linecap="round"/>
  <line x1="60" y1="72" x2="30" y2="58" stroke="#6b4a2e" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="72" x2="90" y2="58" stroke="#6b4a2e" stroke-width="3" stroke-linecap="round"/>
  <!-- Canopy - bottom (mixed green/yellow) -->
  <ellipse cx="34" cy="54" rx="16" ry="14" fill="#8a8a30"/>
  <ellipse cx="86" cy="54" rx="16" ry="14" fill="#6a9a34"/>
  <ellipse cx="60" cy="54" rx="18" ry="14" fill="#b0a838"/>
  <!-- Canopy - mid (more yellow) -->
  <ellipse cx="40" cy="42" rx="18" ry="13" fill="#b8b040"/>
  <ellipse cx="80" cy="42" rx="18" ry="13" fill="#8aaa40"/>
  <ellipse cx="60" cy="40" rx="20" ry="14" fill="#c4b848"/>
  <!-- Canopy - top (still some green) -->
  <ellipse cx="48" cy="30" rx="16" ry="11" fill="#d4c050"/>
  <ellipse cx="72" cy="30" rx="16" ry="11" fill="#b0b448"/>
  <ellipse cx="60" cy="24" rx="17" ry="11" fill="#c4b848"/>
  <!-- Highlights -->
  <ellipse cx="52" cy="28" rx="8" ry="5" fill="#d8c858" opacity="0.5"/>
  <ellipse cx="70" cy="26" rx="7" ry="4" fill="#d8c858" opacity="0.3"/>
  <!-- Falling yellow leaves -->
  <ellipse cx="32" cy="76" rx="3" ry="2" fill="#c4b040" transform="rotate(25,32,76)" opacity="0.6"/>
  <ellipse cx="90" cy="82" rx="2.5" ry="1.5" fill="#b8a838" transform="rotate(-20,90,82)" opacity="0.5"/>
</svg>
