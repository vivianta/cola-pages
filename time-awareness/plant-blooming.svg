<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Ground -->
  <ellipse cx="24" cy="40" rx="20" ry="4" fill="#8b7355"/>
  <!-- Stem -->
  <line x1="24" y1="16" x2="24" y2="40" stroke="#4a7a2e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left leaf -->
  <ellipse cx="17" cy="23" rx="7" ry="5" fill="#5a9a3a" transform="rotate(-25,17,23)"/>
  <!-- Right leaf -->
  <ellipse cx="31" cy="21" rx="7" ry="5" fill="#68aa44" transform="rotate(25,31,21)"/>
  <!-- Top leaf -->
  <ellipse cx="24" cy="15" rx="6" ry="4.5" fill="#7ab84e" transform="rotate(5,24,15)"/>
  <!-- Flowers -->
  <circle cx="19" cy="13" r="2.5" fill="#ff90b0"/>
  <circle cx="29" cy="14" r="2" fill="#ffb0c8"/>
  <circle cx="24" cy="10" r="2.2" fill="#ff98b4"/>
</svg>
